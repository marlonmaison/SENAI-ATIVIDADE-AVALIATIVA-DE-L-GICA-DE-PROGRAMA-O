<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 6</title>
</head>
<body>

    <h1>Reajuste salarial</h1>

    <script>
        let salario = Number(prompt("Digite seu salário atual:"));
        let percentual;

        if (salario <= 280) {
            percentual = 20;
        } else if (salario <= 700) {
            percentual = 15;
        } else if (salario <= 1500) {
            percentual = 10;
        } else {
            percentual = 5;
        }

        let aumento = salario * percentual / 100;
        let novoSalario = salario + aumento;

        alert(
            "Salário antes do reajuste: R$ " + salario.toFixed(2) +
            "\nPercentual de aumento: " + percentual + "%" +
            "\nValor do aumento: R$ " + aumento.toFixed(2) +
            "\nNovo salário: R$ " + novoSalario.toFixed(2)
        );
    </script>

</body>
</html>
