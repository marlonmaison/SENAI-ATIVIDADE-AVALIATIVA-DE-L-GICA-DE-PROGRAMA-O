<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 5</title>
</head>
<body>

    <h1>Verificador de número par ou ímpar</h1>

    <script>
        let numero = Number(prompt("Digite um número inteiro:"));

        if (numero % 2 === 0) {
            alert("O número " + numero + " é par!");
        } else {
            alert("O número " + numero + " é ímpar!");
        }
    </script>

</body>
</html>
